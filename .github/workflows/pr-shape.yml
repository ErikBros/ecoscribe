# Standard process (CLAUDE.md): one ticket = one branch from main = one PR, never stacked.
# Fails a PR that carries another open PR's unmerged commits, or that doesn't target main,
# and a PR that changes what the user sees without touching the guides in docs/ or saying why (dictado-xr3v).
name: pr-shape
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Not stacked, targets main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$BASE" != "main" ]; then
            echo "::error::PRs go into main (this one targets '$BASE'). One ticket = one branch from main."
            exit 1
          fi
          git fetch -q origin main
          bad=0
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefOid --jq '.[] | "\(.number):\(.headRefOid)"'); do
            n=${pr%%:*}; sha=${pr#*:}
            [ "$n" = "$NUMBER" ] && continue
            git fetch -q origin "$sha" 2>/dev/null || continue
            # Stacked = this PR contains another open PR's head commit that main doesn't have yet.
            if git merge-base --is-ancestor "$sha" "$HEAD_SHA" && ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::Stacked on open PR #$n. Merge #$n first, then rebase this branch onto main (or put both in one PR)."
              bad=1
            fi
          done
          exit $bad
      - name: User guides follow the app (tools/docs_check.py)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git diff --name-only "origin/main...$HEAD_SHA" | python3 tools/docs_check.py
      - name: Nothing personal or secret (gitleaks, .gitleaks.toml)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          v=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -c .gitleaks.toml --log-opts="origin/main..$HEAD_SHA" .
