# The Mac download, built and signed by GitHub on every release (dictado-trtz.5).
#
# Windows publishes a release with the installer (tools/release.py); this run builds Ecoscribe.app on a
# GitHub Mac, signs it with the same self-signed "Dictado Local Signing" certificate the Mac uses (macOS
# ties its permission grants to that certificate, so an update keeps them) and attaches
# Ecoscribe-<version>.dmg to the release. On a pull request that touches the Mac build it builds and signs
# only, uploading nothing, so a broken build shows before it reaches a release.
#
# Secrets (set once from the Mac): MAC_SIGNING_P12 (base64 .p12 with the key and certificate) and
# MAC_SIGNING_PASSWORD. They live only in a temporary keychain for this run, which is deleted at the end.
name: mac-release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the Mac download for (vX.Y.Z)"
        required: true
  pull_request:
    paths:
      - .github/workflows/mac-release.yml
      - tools/build_mac.py
      - packaging/macos/**
      - requirements-mac.txt
      - requirements-mac.lock.txt
permissions:
  contents: write
concurrency:
  group: mac-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
env:
  # SHA-1 of the "Dictado Local Signing" certificate the installed Mac app is signed with. A different
  # certificate would make macOS forget the app's permissions, so the run stops instead.
  EXPECTED_SIGNING_SHA1: 6AFF9B00609FFF3F9045164D774708667B05A14E
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Release tag matches the app version
        if: env.TAG != ''
        run: |
          set -euo pipefail
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ecoscribe/__init__.py)
          [ "v$v" = "$TAG" ] || { echo "ecoscribe/__init__.py says $v, the release is $TAG"; exit 1; }
      - name: Mac download already there?
        id: have
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=${TAG#v}
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -qx "Ecoscribe-$v.dmg"; then
            echo "Release $TAG already has Ecoscribe-$v.dmg (uploaded from the Mac); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # uv, like the Mac's own build: it has Python 3.12.13 for arm64 (setup-python doesn't)
      - uses: astral-sh/setup-uv@v6
        if: steps.have.outputs.skip != 'true'
        with:
          python-version: "3.12.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements-mac.lock.txt
      - name: Install
        if: steps.have.outputs.skip != 'true'
        # the same versions as the Mac's own build (requirements-mac.lock.txt), so an update never brings a
        # differently built app; PyInstaller pinned to the Mac's too
        run: |
          uv pip install -r requirements-mac.lock.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8
          python --version
      - name: Signing keychain (temporary)
        id: sign
        if: steps.have.outputs.skip != 'true'
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$MAC_SIGNING_P12" ] && [ -n "$MAC_SIGNING_PASSWORD" ] || { echo "signing secrets missing"; exit 1; }
          kc="$RUNNER_TEMP/ecoscribe-signing.keychain-db"
          kc_pw=$(openssl rand -hex 24)
          echo "::add-mask::$kc_pw"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          p12="$RUNNER_TEMP/identity.p12"
          printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$kc" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # codesign finds identities through the search list; keep the existing ones after ours
          existing=$(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "$kc" $existing
          sha=$(security find-identity -p codesigning "$kc" | awk '/"Dictado Local Signing"/ {print $2; exit}')
          [ "$sha" = "$EXPECTED_SIGNING_SHA1" ] || {
            echo "signing identity is '${sha:-none}', expected $EXPECTED_SIGNING_SHA1: stopping so the Mac keeps its permissions"
            exit 1; }
          echo "identity=$sha" >> "$GITHUB_OUTPUT"
      - name: Build and sign
        if: steps.have.outputs.skip != 'true'
        run: python tools/build_mac.py --identity "${{ steps.sign.outputs.identity }}"
      - name: Check the signature
        if: steps.have.outputs.skip != 'true'
        run: |
          set -euo pipefail
          app=build/mac/dist/Ecoscribe.app
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Authority)='
          codesign -dvv "$app" 2>&1 | grep -qx 'Authority=Dictado Local Signing'
          ls -l build/mac/Ecoscribe-*.dmg
      - name: Attach the .dmg to the release
        if: steps.have.outputs.skip != 'true' && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/mac/Ecoscribe-${TAG#v}.dmg" --repo "$GITHUB_REPOSITORY"
      - name: Remove the signing keychain
        if: always()
        run: |
          kc="$RUNNER_TEMP/ecoscribe-signing.keychain-db"
          if [ -e "$kc" ]; then security delete-keychain "$kc"; fi
          rm -f "$RUNNER_TEMP/identity.p12"
